<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rico Live - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(to bottom, #1a0b2e, #3b156e);
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            z-index: -1;
        }
        
        @keyframes moveBackground {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 30px;            animation: fadeInDown 1s ease-out;
        }
        
        .app-logo {
            width: 120px;
            height: 120px;
            border-radius: 30px;
            object-fit: cover;
            box-shadow: 0 10px 40px rgba(255, 64, 129, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }
        
        .app-name {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff4081 0%, #ff80ab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .tagline {
            color: #b8b8b8;
            font-size: 1rem;
            margin-bottom: 50px;
            text-align: center;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            animation: fadeInUp 1s ease-out;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-google {
            background: white;
            color: #333;
        }
        
        .btn-google:hover {
            background: #f5f5f5;
        }
        
        .btn-quick {
            background: linear-gradient(135deg, #ff4081 0%, #ff80ab 100%);
            color: white;
            font-size: 1.1rem;
            padding: 18px;
        }
        
        .btn-quick:hover {
            background: linear-gradient(135deg, #ff5c93 0%, #ff99bb 100%);
        }
        
        .google-icon {
            width: 24px;
            height: 24px;
        }
        
        .footer-text {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 30px;
            line-height: 1.5;
        }
        
        .footer-text a {
            color: #ff4081;
            text-decoration: none;
        }
                @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ff4081;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style></head>
<body>

    <div class="logo-container">
        <img src="assets/app_logo.png" alt="Rico Live Logo" class="app-logo">
        <h1 class="app-name">Kaira Live</h1>
        <p class="tagline">Go Live. Make Friends. Earn Gifts.</p>
    </div>

    <div class="login-container">
        <button class="btn btn-google" onclick="googleLogin()">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
        </button>

        <button class="btn btn-quick" onclick="quickLogin()">
            <span style="font-size: 1.3rem;">⚡</span>
            QUICK LOGIN
        </button>
    </div>

    <div class="footer-text">
        By using the application, you agree to our<br>
        <a href="#">User Agreement</a> and <a href="#">Privacy Agreement</a>
    </div>

    <div class="loading" id="loadingOverlay">
        <div class="spinner"></div>
        <p style="color: white; margin-top: 20px;">Please wait...</p>
    </div>

    <script>
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function googleLogin() {
            showLoading();
            const provider = new firebase.auth.GoogleAuthProvider();
            
            auth.signInWithPopup(provider)                .then((result) => {
                    const user = result.user;
                    checkUserExists(user);
                })
                .catch((error) => {
                    hideLoading();
                    console.error(error);
                    alert("Login Failed: " + error.message);
                });
        }

        function quickLogin() {
            showLoading();
            setTimeout(() => {
                hideLoading();
                window.location.href = 'gender.html';
            }, 500);
        }

        function checkUserExists(user) {
            db.collection('users').doc(user.uid).get().then((doc) => {
                if (doc.exists && doc.data().profileComplete) {
                    window.location.href = 'home.html';
                } else {
                    db.collection('users').doc(user.uid).set({
                        email: user.email,
                        name: user.displayName,
                        photoURL: user.photoURL,
                        uid: user.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true })
                    .then(() => {
                        hideLoading();
                        window.location.href = 'gender.html';
                    })
                    .catch((error) => {
                        hideLoading();
                        console.error("Error saving user:", error);
                        alert("Error saving profile");
                    });
                }
            })
            .catch((error) => {
                hideLoading();
                console.error("Error checking user:", error);
                window.location.href = 'gender.html';
            });
        }
        
        window.onload = function() {            auth.onAuthStateChanged((user) => {
                if (user) {
                    db.collection('users').doc(user.uid).get().then((doc) => {
                        if (doc.exists && doc.data().profileComplete) {
                            window.location.href = 'home.html';
                        }
                    });
                }
            });
        };
    </script>
</body>
</html>
