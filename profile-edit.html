<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Rico Live</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(0,0,0,0.15);
        }

        .back-btn {
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            text-decoration: none;
            color: white;
        }

        .top-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .save-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 8px 22px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .save-btn:hover { transform: scale(1.05); }
        .save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Center Content */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 55px 20px 30px;
            gap: 32px;
        }

        /* Avatar */
        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .avatar-wrapper img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
        }

        .camera-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 34px;
            height: 34px;
            background: #ff4081;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            border: 2px solid white;
        }

        #photoInput { display: none; }

        /* Upload Progress */
        .upload-progress {
            display: none;
            width: 120px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-top: -20px;
            overflow: hidden;
        }

        .upload-progress-bar {
            height: 100%;
            background: white;
            border-radius: 2px;
            width: 0%;
            transition: width 0.2s;
        }

        /* Name Field */
        .name-field {
            width: 100%;
            max-width: 320px;
            background: rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 16px 18px;
        }

        .name-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .name-input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 1.15rem;
            font-weight: bold;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        .name-input::placeholder { color: rgba(255,255,255,0.35); font-weight: normal; }

        .name-underline {
            height: 1px;
            background: rgba(255,255,255,0.25);
            margin-top: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 9999;
            transition: transform 0.35s ease;
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Spinner */
        .spinner-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 500;
            align-items: center;
            justify-content: center;
        }

        .spinner-overlay.show { display: flex; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="spinner-overlay" id="spinnerOverlay">
    <div class="spinner"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Top Bar -->
<div class="top-bar">
    <a href="me.html" class="back-btn">‹</a>
    <span class="top-title">Edit Profile</span>
    <button class="save-btn" id="saveBtn" onclick="saveProfile()">Save</button>
</div>

<!-- Main Content -->
<div class="center-content">

    <!-- Profile Photo -->
    <div class="avatar-wrapper">
        <img src="https://via.placeholder.com/120" alt="Profile" id="userPhoto">
        <div class="camera-btn" onclick="document.getElementById('photoInput').click()">📷</div>
    </div>
    <input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto(this)">

    <div class="upload-progress" id="uploadProgress">
        <div class="upload-progress-bar" id="uploadProgressBar"></div>
    </div>

    <!-- Name Field -->
    <div class="name-field">
        <div class="name-label">Display Name</div>
        <input class="name-input" type="text" id="inputName" placeholder="Enter your name" maxlength="30">
        <div class="name-underline"></div>
    </div>

</div>

<script>
    let currentUser = null;
    let newPhotoURL = '';

    // Auth Check
    auth.onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = 'login.html';
        } else {
            currentUser = user;
            loadProfile(user.uid);
        }
    });

    // Load from Firestore
    async function loadProfile(uid) {
        showSpinner(true);
        try {
            const doc = await db.collection('users').doc(uid).get();
            if (doc.exists) {
                const d = doc.data();
                if (d.photoURL) {
                    document.getElementById('userPhoto').src = d.photoURL;
                    newPhotoURL = d.photoURL;
                }
                document.getElementById('inputName').value = d.name || '';
            }
        } catch (err) {
            showToast('❌ Failed to load profile');
        } finally {
            showSpinner(false);
        }
    }

    // Cloudinary Photo Upload
    async function uploadPhoto(input) {
        const file = input.files[0];
        if (!file) return;

        // Instant local preview
        const reader = new FileReader();
        reader.onload = e => document.getElementById('userPhoto').src = e.target.result;
        reader.readAsDataURL(file);

        const progressWrap = document.getElementById('uploadProgress');
        const progressBar  = document.getElementById('uploadProgressBar');
        progressWrap.style.display = 'block';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', cloudinaryConfig.uploadPreset);

        try {
            const xhr = new XMLHttpRequest();
            xhr.upload.onprogress = e => {
                if (e.lengthComputable)
                    progressBar.style.width = (e.loaded / e.total * 100) + '%';
            };

            const result = await new Promise((resolve, reject) => {
                xhr.open('POST', `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`);
                xhr.onload  = () => resolve(JSON.parse(xhr.responseText));
                xhr.onerror = () => reject();
                xhr.send(formData);
            });

            newPhotoURL = result.secure_url;
            showToast('✅ Photo uploaded!');
        } catch {
            showToast('❌ Photo upload failed');
        } finally {
            progressWrap.style.display = 'none';
            progressBar.style.width = '0%';
        }
    }

    // Save to Firestore
    async function saveProfile() {
        if (!currentUser) return;

        const name = document.getElementById('inputName').value.trim();
        if (!name) { showToast('⚠️ Name cannot be empty'); return; }

        document.getElementById('saveBtn').disabled = true;
        showSpinner(true);

        try {
            const updateData = {
                name,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            if (newPhotoURL) updateData.photoURL = newPhotoURL;

            await db.collection('users').doc(currentUser.uid).update(updateData);

            showToast('✅ Profile saved!');
            setTimeout(() => window.location.href = 'me.html', 1200);
        } catch (err) {
            showToast('❌ Save failed: ' + err.message);
            document.getElementById('saveBtn').disabled = false;
        } finally {
            showSpinner(false);
        }
    }

    // Helpers
    function showSpinner(show) {
        document.getElementById('spinnerOverlay').classList.toggle('show', show);
    }

    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
