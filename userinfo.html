<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setup - Rico Live</title>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #10b981;
            --error: #ef4444;
            --light: #f9fafb;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-muted: #6b7280;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }
        .header { margin-bottom: 30px; text-align: center; }
        .header h1 { font-size: 2rem; margin-bottom: 8px; }
        .header p { color: var(--text-muted); }

        .form-card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
        }

        .info-banner {
            background: rgba(102,126,234,0.08);
            border: 1px solid rgba(102,126,234,0.2);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .photo-section { text-align: center; margin-bottom: 25px; }
        .photo-container {
            width: 140px;
            height: 140px;
            margin: auto;
            position: relative;
            cursor: pointer;
        }

        .photo-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--border);
        }

        .photo-preview { width: 100%; height: 100%; object-fit: cover; }

        .camera-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            color: white;
            padding: 10px;
            border-radius: 50%;
        }

        .form-group { margin-bottom: 18px; }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--border);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
        }

        .toast {
            background: var(--primary);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            color: white;
        }

        .loading-overlay.active { display: flex; }
    </style>
</head>

<body>

<div class="header">
    <h1>📋 Complete Your Profile</h1>
    <p>Almost done!</p>
</div>

<div class="form-card">

    <div class="info-banner" id="infoBanner">
        <span id="bannerText">Loading...</span>
    </div>

    <div class="photo-section">
        <div class="photo-container" onclick="document.getElementById('galleryInput').click()">
            <div class="photo-wrapper">
                <img id="previewImg" class="photo-preview" src="https://via.placeholder.com/140">
            </div>
            <div class="camera-badge">📸</div>
        </div>

        <input type="file" id="galleryInput" hidden onchange="handlePhotoSelect(event)">
    </div>

    <div class="form-group">
        <input id="nameInput" placeholder="Full Name" oninput="validateField('nameInput')">
    </div>

    <div class="form-group">
        <input id="dobInput" type="date" onchange="validateField('dobInput')">
    </div>

    <button class="submit-btn" onclick="saveProfile()">COMPLETE PROFILE</button>
</div>

<div class="toast-container" id="toastContainer"></div>
<div class="loading-overlay" id="loadingOverlay">Loading...</div>


<script>
let uploadedPhotoURL = null;
let selectedFile = null;

const selectedGender = localStorage.getItem('selectedGender') || '';
const selectedCountry = localStorage.getItem('selectedCountry') || '';
const selectedCountryCode = localStorage.getItem('selectedCountryCode') || '';
const selectedMobile = localStorage.getItem('selectedMobile') || '';

function showToast(msg){
    const div = document.createElement("div");
    div.className = "toast";
    div.innerText = msg;
    document.getElementById("toastContainer").appendChild(div);
    setTimeout(()=>div.remove(),3000);
}

function setLoading(show){
    document.getElementById("loadingOverlay").classList.toggle("active", show);
}

function validateField(id){
    const el = document.getElementById(id);
    return el.value.trim().length > 1;
}

function handlePhotoSelect(e){
    const file = e.target.files[0];
    if(!file) return;
    selectedFile = file;

    const reader = new FileReader();
    reader.onload = (ev)=>{
        document.getElementById("previewImg").src = ev.target.result;
        uploadedPhotoURL = ev.target.result;
    };
    reader.readAsDataURL(file);
}

async function uploadToCloudinary(file){
    try{
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", cloudinaryConfig.uploadPreset);

        const res = await fetch(
            `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`,
            { method:"POST", body: formData }
        );

        const data = await res.json();

        if(!data.secure_url){
            throw new Error("Upload failed");
        }

        return data.secure_url;

    }catch(err){
        throw new Error("Image upload failed");
    }
}

async function saveProfile(){
    try{

        const user = auth?.currentUser;

        if(!user){
            showToast("Login needed");
            return;
        }

        const name = document.getElementById("nameInput").value.trim();
        const dob = document.getElementById("dobInput").value;

        if(name.length < 2){
            showToast("Valid name দাও");
            return;
        }

        if(!dob){
            showToast("DOB দাও");
            return;
        }

        setLoading(true);

        let photo = uploadedPhotoURL || "";

        if(selectedFile){
            photo = await uploadToCloudinary(selectedFile);
        }

        await db.collection("users").doc(user.uid).set({
            uid: user.uid,
            name,
            dob,
            gender: selectedGender,
            country: selectedCountry,
            countryCode: selectedCountryCode,
            mobile: selectedMobile,
            photoURL: photo,
            profileComplete: true
        }, { merge: true });

        showToast("Profile Saved ✅");

        setTimeout(()=>{
            window.location.href = "home.html";
        }, 1200);

    }catch(err){
        showToast(err.message);
    }finally{
        setLoading(false);
    }
}

</script>

</body>
</html>
