<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setup - Rico Live</title>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #10b981;
            --error: #ef4444;
            --light: #f9fafb;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-muted: #6b7280;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }
        .header { margin-bottom: 30px; text-align: center; }
        .header h1 { font-size: 2rem; margin-bottom: 8px; }
        .header p { color: var(--text-muted); }

        .form-card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
        }

        .info-banner {
            background: rgba(102,126,234,0.08);
            border: 1px solid rgba(102,126,234,0.2);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .photo-section { text-align: center; margin-bottom: 25px; }
        .photo-container {
            width: 140px;
            height: 140px;
            margin: auto;
            position: relative;
            cursor: pointer;
        }

        .photo-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--border);
        }

        .photo-preview { width: 100%; height: 100%; object-fit: cover; }

        .camera-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            color: white;
            padding: 10px;
            border-radius: 50%;
        }

        .form-group { margin-bottom: 18px; }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--border);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
        }

        .toast {
            background: var(--primary);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            color: white;
        }

        .loading-overlay.active { display: flex; }
    </style>
</head>

<body>

<div class="header">
    <h1>📋 Complete Your Profile</h1>
    <p>Almost done!</p>
</div>

<div class="form-card">

    <div class="info-banner" id="infoBanner">
        <span id="bannerText">Loading...</span>
    </div>

    <div class="photo-section">
        <div class="photo-container" onclick="document.getElementById('galleryInput').click()">
            <div class="photo-wrapper">
                <img id="previewImg" class="photo-preview" src="https://via.placeholder.com/140">
            </div>
            <div class="camera-badge">📸</div>
        </div>

        <input type="file" id="galleryInput" hidden onchange="handlePhotoSelect(event)">
    </div>

    <div class="form-group">
        <input id="nameInput" placeholder="Full Name" oninput="validateField('nameInput')">
    </div>

    <div class="form-group">
        <input id="dobInput" type="date" onchange="validateField('dobInput')">
    </div>

    <button class="submit-btn" onclick="saveProfile()">COMPLETE PROFILE</button>
</div>

<div class="toast-container" id="toastContainer"></div>
<div class="loading-overlay" id="loadingOverlay">Loading...</div>


<script>
async function saveProfile() {
    try {

        // 🔥 Check Firebase loaded
        if (typeof auth === "undefined" || typeof db === "undefined") {
            showToast("❌ Firebase not loaded");
            return;
        }

        const user = auth.currentUser;

        if (!user) {
            showToast("❌ Login needed");
            setTimeout(() => window.location.href = "login.html", 1500);
            return;
        }

        // 🔥 Validate fields
        const name = document.getElementById("nameInput").value.trim();
        const dob = document.getElementById("dobInput").value;

        if (name.length < 2) {
            showToast("❌ Name too short");
            return;
        }

        if (!dob) {
            showToast("❌ Date of birth required");
            return;
        }

        // 🔥 Loading UI
        document.getElementById("loadingOverlay").classList.add("active");
        document.getElementById("submitBtn").disabled = true;

        let finalPhotoURL = uploadedPhotoURL || user.photoURL || "";

        // 📸 Upload photo if selected
        if (selectedFile) {
            finalPhotoURL = await uploadToCloudinary(selectedFile);
        }

        // 🔢 USER ID GENERATOR (NO DUPLICATE)
        const counterRef = db.collection("counters").doc("userCount");

        let numericId;

        const existing = await db.collection("users").doc(user.uid).get();

        if (existing.exists && existing.data().userId) {
            numericId = existing.data().userId;
        } else {
            numericId = await db.runTransaction(async (t) => {
                const snap = await t.get(counterRef);

                let count = 0;
                if (snap.exists && snap.data().count) {
                    count = snap.data().count;
                }

                const newId = count + 1;

                t.set(counterRef, { count: newId });

                return newId;
            });
        }

        // 💾 SAVE TO FIRESTORE
        await db.collection("users").doc(user.uid).set({
            uid: user.uid,
            userId: numericId, // 👈 YOUR UNIQUE ID
            name: name,
            dob: dob,
            gender: selectedGender,
            country: selectedCountry,
            countryCode: selectedCountryCode,
            mobile: selectedMobile,
            photoURL: finalPhotoURL,
            profileComplete: true,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // 🔥 UPDATE AUTH PROFILE
        await user.updateProfile({
            displayName: name,
            photoURL: finalPhotoURL
        });

        // 🧹 CLEAN LOCAL STORAGE
        localStorage.removeItem("selectedGender");
        localStorage.removeItem("selectedCountry");
        localStorage.removeItem("selectedCountryCode");
        localStorage.removeItem("selectedMobile");

        showToast("✅ Profile saved successfully!");

        setTimeout(() => {
            window.location.href = "home.html";
        }, 1500);

    } catch (err) {
        console.error(err);
        showToast("❌ " + err.message);
    } finally {
        document.getElementById("loadingOverlay").classList.remove("active");
        document.getElementById("submitBtn").disabled = false;
    }
}
</script>

</body>
</html>
