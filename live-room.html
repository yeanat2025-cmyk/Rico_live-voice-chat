<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Room - Rico Live</title>
    
    <!-- Firebase & Zego SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="config.js"></script>
    
    <!-- ZegoCloud SDK for Audio/Video -->
    <script src="https://zego.im/downloads/express-video-sdk/js/ZegoExpressWebRTC-2.15.0.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        body {
            background: #0a1128; /* Deep Blue */
            background-image: linear-gradient(to bottom, #020617, #0f172a, #1e1b4b);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Background Stars Effect */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://assets.codepen.io/13471/stars.png');
            opacity: 0.5; z-index: 0; pointer-events: none;
        }

        /* Top Bar */
        .top-bar {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }
        .room-info { display: flex; align-items: center; gap: 10px; }
        .host-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ff4081; }
        .room-name { font-weight: bold; font-size: 1.1rem; }
        .room-id { font-size: 0.8rem; opacity: 0.7; }        .exit-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }

        /* Seat Grid */
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 20px;
            z-index: 5;
            max-width: 600px;
            margin: 0 auto;
        }

        .seat {
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .seat.locked { border-color: #ff4081; background: rgba(255, 64, 129, 0.2); }
        .seat.speaking { border-color: #4caf50; box-shadow: 0 0 15px #4caf50; }
        
        .seat-icon { font-size: 1.5rem; opacity: 0.7; }
        .seat-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .seat-number { font-size: 0.7rem; margin-top: 5px; opacity: 0.8; }
        
        /* Mic Status */
        .mic-icon {
            position: absolute; bottom: 5px; right: 5px;
            background: black; width: 16px; height: 16px;
            border-radius: 50%; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            z-index: 5;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }
        .chat-msg {
            background: rgba(255,255,255,0.15);
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 8px;
            display: inline-block;
            max-width: 85%;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }
        .chat-user { color: #64b5f6; font-weight: bold; margin-right: 5px; }
        .gift-msg { color: #ffeb3b; }

        /* Bottom Controls */
        .bottom-controls {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }

        .input-box {
            flex: 1;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 15px;
            margin-right: 10px;
            border: none;
            color: white;
        }
        .input-box::placeholder { color: rgba(255,255,255,0.6); }

        .action-btn {
            width: 45px; height: 45px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }

        .gift-btn {
            background: linear-gradient(135deg, #ff4081, #f50057);
            transform: scale(1.1);
        }
        /* Admin/Host Menu */
        .host-menu {
            position: absolute; top: 50px; right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 10px;
            display: none;
        }
        .host-menu.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="stars"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="room-info">
            <img src="https://via.placeholder.com/40" id="hostAvatar" class="host-avatar">
            <div>
                <div class="room-name" id="roomName">Live Room</div>
                <div class="room-id" id="roomIdDisplay">ID: ...</div>
            </div>
        </div>
        <button class="exit-btn" onclick="leaveRoom()">🚪</button>
    </div>

    <!-- Host Controls (Hidden by default) -->
    <div class="host-menu" id="hostMenu">
        <button onclick="toggleLockAll()" style="color:white; background:#ff4081; border:none; padding:5px;">🔒 Lock All</button>
    </div>

    <!-- 10 Seats Grid -->
    <div class="seats-grid" id="seatsGrid">
        <!-- Seats generated by JS -->
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <div class="chat-msg">Welcome to the room! 🎉</div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
        <button class="action-btn" onclick="toggleMic()">🎤</button>
        <input type="text" class="input-box" id="chatInput" placeholder="Say something...">
        <button class="action-btn gift-btn" onclick="sendGift()">🎁</button>        <button class="action-btn" onclick="toggleChat()">💬</button>
    </div>

    <script>
        // --- 1. CONFIG & STATE ---
        let currentUser = null;
        let roomData = {};
        let dbRef = null;
        let zgEngine = null; // Zego Engine
        let localStreamID = '';
        let isMicOn = true;

        // Get Room ID from URL (?roomId=12345)
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId') || '1800304';

        // --- 2. INITIALIZATION ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                initRoom();
            } else {
                window.location.href = 'login.html';
            }
        });

        function initRoom() {
            dbRef = firebase.database().ref('rooms/' + roomId);

            // Load Room Data
            dbRef.on('value', snapshot => {
                roomData = snapshot.val() || {};
                renderSeats();
                if(!roomData.hostId) {
                    // If no host, current user becomes host
                    dbRef.update({ hostId: currentUser.uid, hostName: currentUser.displayName });
                }
            });

            // Listen for Chat
            dbRef.child('messages').limitToLast(50).on('child_added', snapshot => {
                addMessageToUI(snapshot.val());
            });

            // Initialize Zego (Basic Setup)
            initZego();
        }

        // --- 3. UI RENDERING ---
        function renderSeats() {            const grid = document.getElementById('seatsGrid');
            grid.innerHTML = '';
            
            for(let i=0; i<10; i++) {
                const seatUser = roomData.seats ? roomData.seats[i] : null;
                const isLocked = roomData.lockedSeats && roomData.lockedSeats[i];
                
                const div = document.createElement('div');
                div.className = `seat ${isLocked ? 'locked' : ''}`;
                div.innerHTML = seatUser ? 
                    `<img src="${seatUser.photo}" class="seat-avatar"><div class="mic-icon">${isMicOn ? '🎙' : '🔇'}</div>` : 
                    (isLocked ? '🔒' : '🪑');
                
                div.innerHTML += `<span class="seat-number">${i+1}</span>`;
                
                // Seat Click Action
                div.onclick = () => {
                    if(seatUser) {
                        if(currentUser.uid === roomData.hostId) {
                            if(confirm('Kick user?')) kickUser(i);
                        }
                    } else {
                        joinSeat(i);
                    }
                };
                grid.appendChild(div);
            }

            document.getElementById('hostAvatar').src = roomData.hostPhoto || currentUser.photoURL;
            document.getElementById('roomName').textContent = roomData.hostName || 'User';
            document.getElementById('roomIdDisplay').textContent = 'ID: ' + roomId;
        }

        // --- 4. ACTIONS (JOIN, GIFT, KICK) ---
        function joinSeat(index) {
            if(roomData.lockedSeats && roomData.lockedSeats[index]) {
                alert('This seat is locked!');
                return;
            }
            const seats = roomData.seats || Array(10).fill(null);
            seats[index] = { uid: currentUser.uid, name: currentUser.displayName, photo: currentUser.photoURL };
            dbRef.update({ seats: seats });
            addSystemMessage(`${currentUser.displayName} joined seat ${index+1}`);
        }

        function kickUser(index) {
            const seats = roomData.seats || Array(10).fill(null);
            seats[index] = null;
            dbRef.update({ seats: seats });
        }
        function toggleLockAll() {
            // Simple toggle logic for all seats
            const newLocked = !roomData.isAllLocked;
            dbRef.update({ isAllLocked: newLocked });
        }

        function sendGift() {
            const giftData = {
                type: 'gift',
                user: currentUser.displayName,
                text: 'sent a 🚀 Rocket!',
                timestamp: Date.now()
            };
            dbRef.child('messages').push(giftData);
        }

        // --- 5. CHAT SYSTEM ---
        document.getElementById('chatInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value.trim()) {
                dbRef.child('messages').push({
                    type: 'text',
                    user: currentUser.displayName,
                    text: this.value,
                    timestamp: Date.now()
                });
                this.value = '';
            }
        });

        function addMessageToUI(msg) {
            const area = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = msg.type === 'gift' ? 
                `<span class="gift-msg">🎁 <b>${msg.user}</b> ${msg.text}</span>` :
                `<span class="chat-user">${msg.user}</span>${msg.text}`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        // --- 6. ZEGO CLOUD (AUDIO/VIDEO) ---
        async function initZego() {
            // Replace with your Zego AppID and ServerSecret
            const appID = 933599058L; 
            const serverSecret = '4228423e7c2c81fca1ec1e7de5f1f058f2b06a7554499e3cf985ab3c830d10de';
            
            zgEngine = new ZegoExpressEngine(appID, serverSecret);
            await zgEngine.createEngine();
                        // Login to Room
            await zgEngine.loginRoom(roomId, 'YOUR_TOKEN', { userID: currentUser.uid, userName: currentUser.displayName });
        }

        async function toggleMic() {
            if(!zgEngine) return;
            if(isMicOn) {
                // zgEngine.muteMicrophone(true);
                isMicOn = false;
            } else {
                // zgEngine.muteMicrophone(false);
                isMicOn = true;
            }
            // Update UI (Visual only for this demo)
            addSystemMessage(isMicOn ? 'Mic On 🎙' : 'Mic Off 🔇');
        }

        function leaveRoom() {
            if(zgEngine) zgEngine.logoutRoom(roomId);
            // Remove user from seat
            const seats = roomData.seats || [];
            const mySeatIndex = seats.findIndex(s => s && s.uid === currentUser.uid);
            if(mySeatIndex > -1) {
                seats[mySeatIndex] = null;
                dbRef.update({ seats: seats });
            }
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
