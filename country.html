<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rico Live - Select Country</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            background: #f8f9fa;
            overflow: hidden;
        }

        .country-container {
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #f0f0f0;        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: #333;
        }

        .logo-small {
            width: 35px;
            height: 35px;
        }

        .title-section {
            margin-bottom: 25px;
        }

        .title-section h2 {
            font-size: 14px;
            color: #00bcd4;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .title-section h1 {
            font-size: 28px;
            color: #1a1a2e;
            font-weight: 800;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            height: 48px;
            border-radius: 24px;
            border: 2px solid #e0e0e0;
            padding: 0 20px 0 48px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: white;
        }

        .search-box input:focus {
            border-color: #00bcd4;            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #999;
        }

        .country-list {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .country-list::-webkit-scrollbar {
            width: 4px;
        }

        .country-list::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 2px;
        }

        .country-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 8px;
            background: white;
        }

        .country-item:hover {
            background: #f0f0f0;
        }

        .country-item.selected {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.1), rgba(0, 188, 212, 0.05));
            border: 2px solid #00bcd4;
        }

        .country-flag {            width: 48px;
            height: 36px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: #f5f5f5;
        }

        .country-info {
            flex: 1;
        }

        .country-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .country-code {
            font-size: 13px;
            color: #999;
            margin-top: 2px;
        }

        .country-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .country-item.selected .country-check {
            background: #00bcd4;
            border-color: #00bcd4;
        }

        .country-check svg {
            width: 14px;
            height: 14px;
            fill: white;
            opacity: 0;            transition: opacity 0.3s;
        }

        .country-item.selected .country-check svg {
            opacity: 1;
        }

        .mobile-section {
            margin-top: 20px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .mobile-section label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
            display: block;
        }

        .mobile-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .country-code-display {
            height: 48px;
            padding: 0 15px;
            border-radius: 24px;
            border: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            font-size: 15px;
            font-weight: 600;
            color: #00bcd4;
            background: #f8f9fa;
            min-width: 70px;
        }

        .mobile-input-wrapper input {
            flex: 1;
            height: 48px;
            border-radius: 24px;
            border: 2px solid #e0e0e0;
            padding: 0 20px;
            font-size: 15px;
            outline: none;            transition: all 0.3s;
        }

        .mobile-input-wrapper input:focus {
            border-color: #00bcd4;
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.1);
        }

        .next-btn {
            width: 100%;
            height: 56px;
            border-radius: 28px;
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.5;
            pointer-events: none;
        }

        .next-btn.active {
            opacity: 1;
            pointer-events: all;
        }

        .next-btn.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 188, 212, 0.3);
        }
    </style>
</head>
<body>
    <div class="country-container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='gender.html'">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <svg class="logo-small" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="url(#logoGrad)" opacity="0.8"/>
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff6b9d"/>                        <stop offset="100%" stop-color="#c44dff"/>
                    </linearGradient>
                </defs>
                <circle cx="50" cy="38" r="15" fill="white" opacity="0.9"/>
                <path d="M30 75 Q30 58 50 58 Q70 58 70 75 Z" fill="white" opacity="0.9"/>
            </svg>
            <div style="width: 40px;"></div>
        </div>

        <div class="title-section">
            <h2>Your Location</h2>
            <h1>Select Country</h1>
        </div>

        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" placeholder="Search country..." id="searchInput" oninput="filterCountries()">
        </div>

        <div class="country-list" id="countryList">
            <!-- Countries will be populated by JS -->
        </div>

        <div class="mobile-section">
            <label>Mobile Number</label>
            <div class="mobile-input-wrapper">
                <div class="country-code-display" id="codeDisplay">+880</div>
                <input type="tel" placeholder="01XXXXXXXXX" id="mobileInput" oninput="validateForm()">
            </div>
        </div>

        <button class="next-btn" id="nextBtn" onclick="nextPage()">NEXT</button>
    </div>

    <script>
        const countries = [
            { name: "Bangladesh", code: "+880", flag: "🇧🇩" },
            { name: "India", code: "+91", flag: "🇮🇳" },
            { name: "Pakistan", code: "+92", flag: "🇵🇰" },
            { name: "Indonesia", code: "+62", flag: "🇩" },
            { name: "Nigeria", code: "+234", flag: "🇳🇬" },
            { name: "Turkey", code: "+90", flag: "🇹🇷" },
            { name: "Brazil", code: "+55", flag: "🇷" },
            { name: "Egypt", code: "+20", flag: "🇬" },
            { name: "Philippines", code: "+63", flag: "🇵🇭" },
            { name: "Vietnam", code: "+84", flag: "🇻🇳" },
            { name: "Thailand", code: "+66", flag: "🇹🇭" },
            { name: "Malaysia", code: "+60", flag: "🇲🇾" },            { name: "Saudi Arabia", code: "+966", flag: "🇸🇦" },
            { name: "UAE", code: "+971", flag: "🇦🇪" },
            { name: "Kenya", code: "+254", flag: "🇰🇪" },
            { name: "Morocco", code: "+212", flag: "🇲🇦" },
            { name: "South Africa", code: "+27", flag: "🇿🇦" },
            { name: "Mexico", code: "+52", flag: "🇽" },
            { name: "Colombia", code: "+57", flag: "🇨🇴" },
            { name: "Argentina", code: "+54", flag: "🇦🇷" }
        ];

        let selectedCountry = null;

        function renderCountries(list) {
            const container = document.getElementById('countryList');
            container.innerHTML = list.map((country, index) => `
                <div class="country-item ${selectedCountry === index ? 'selected' : ''}" onclick="selectCountry(${index}, this)">
                    <div class="country-flag">${country.flag}</div>
                    <div class="country-info">
                        <div class="country-name">${country.name}</div>
                        <div class="country-code">${country.code}</div>
                    </div>
                    <div class="country-check">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                    </div>
                </div>
            `).join('');
        }

        function selectCountry(index, element) {
            selectedCountry = index;
            const country = countries[index];

            // Update selection visual
            document.querySelectorAll('.country-item').forEach(item => {
                item.classList.remove('selected');
            });
            element.classList.add('selected');

            // Update code display
            document.getElementById('codeDisplay').textContent = country.code;

            // Save to localStorage
            localStorage.setItem('country', country.name);
            localStorage.setItem('countryCode', country.code);

            validateForm();
        }
        function filterCountries() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = countries.filter(c => c.name.toLowerCase().includes(query));
            renderCountries(filtered);
        }

        function validateForm() {
            const mobile = document.getElementById('mobileInput').value;
            const btn = document.getElementById('nextBtn');

            if (selectedCountry !== null && mobile.length >= 8) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function nextPage() {
            if (selectedCountry !== null && document.getElementById('mobileInput').value.length >= 8) {
                localStorage.setItem('mobile', document.getElementById('mobileInput').value);
                window.location.href = 'userinfo.html';
            }
        }

        // Auto-select Bangladesh as default
        selectCountry(0, document.querySelector('.country-item'));

        // Initial render
        renderCountries(countries);
    </script>
</body>
</html>
